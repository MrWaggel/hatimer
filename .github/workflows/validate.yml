name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  repository:
    name: Repository metadata
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      metadata: read
      administration: write
    steps:
      - name: Set description and topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='Configurable countdown timers for Home Assistant' \
            -F has_issues=true
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" \
            --input - <<'EOF'
{"names":["home-assistant","homeassistant","hacs","integration","custom-component","timer"]}
EOF

  hacs:
    name: HACS Action (integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"